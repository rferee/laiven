# Preserve the upstream X-Forwarded-Proto if the outer proxy (nginx-proxy /
# Caddy / Traefik) already set it — otherwise fall back to $scheme. Without
# this, the inner nginx listens on :80 so $scheme is always "http", which
# overwrites the "https" value set by the TLS-terminating proxy in front of
# us. The backend then sees http, @fastify/session refuses to set the
# `secure` session cookie, and every login silently fails.
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $scheme;
    ~.+     $http_x_forwarded_proto;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API proxy
    location /api/ {
        proxy_pass http://laiven-server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
